<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weekly Timetable</title>
  <style>
    /* CSS formatting */
    table { border-collapse: collapse; width: 80%; margin:20px auto; }
    th, td { border:1px solid #333; padding:10px; text-align:center; }
    th { background:#004080; color:white; }
    td.lab { background:#ffeb99; }
  </style>
</head>
<body>
  <h2 style="text-align:center;">Laboratory Timetable</h2>

  <!-- Table with merged rows/columns -->
  <table>
    <tr>
      <th>Day</th><th>9-10</th><th>10-11</th><th>11-12</th>
    </tr>
    <tr>
      <td>Monday</td><td colspan="2" class="lab">Lab</td><td>Math</td>
    </tr>
    <tr>
      <td>Tuesday</td><td>English</td><td>Science</td><td class="lab">Lab</td>
    </tr>
    <tr>
      <td>Wednesday</td><td colspan="3">Project Work</td>
    </tr>
  </table>
</body>
</html>
